<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihon GO!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="hamburger-menu">☰</div>
        <div id="title">Nihon GO!</div>
    </header>
    <nav>
        <ul>
            <li><strong>Katakana</strong></li>
            <li><a href="#" data-view="katakana-browse">Browse</a></li>
            <li><a href="#" data-view="katakana-quiz">Quiz</a></li>
        </ul>
    </nav>
    <main>
        <div id="home-view" class="view active">
            <h1 id="welcome-message">Welcome to Nihon GO!</h1>
        </div>
        <div id="katakana-browse-view" class="view">
            <!-- Katakana Browse content will go here -->
        </div>
        <div id="katakana-quiz-view" class="view">
            <!-- Katakana Quiz content will go here -->
        </div>
    </main>

    <!-- Modal -->
    <div id="kana-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Load data first -->
    <script src="katakana.js"></script>
    <!-- Load logic second -->
    <script src="scripts.js"></script>
</body>
</html>
